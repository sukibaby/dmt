name: DMT workflow auto-release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build_and_release:
    name: Build & Release!

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            pkg_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            pkg_arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Calculate next version
        run: |
          git fetch --force --prune --tags origin
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" "[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n1)
          LATEST_TAG=${LATEST_TAG#v}

          if [ -z "$LATEST_TAG" ]; then
            VERSION=0.1.0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          while git ls-remote --tags --quiet origin "refs/tags/v$VERSION" "refs/tags/$VERSION" | grep -q .; do
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Next version: $VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libcurl4-openssl-dev gh

      - name: Build ${{ matrix.arch }} Linux .deb package
        run: |
          mkdir -p build/${{ matrix.arch }} artifacts
          cd build/${{ matrix.arch }}
          cmake -DCMAKE_BUILD_TYPE=Release -DWITH_CPACK=ON -DDMT_VERSION="$VERSION" -DCPACK_PACKAGE_VERSION="$VERSION" -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} ../..
          cmake --build . --config Release
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.pkg_arch }}
          DEB_FILE=$(ls -1 *.deb | head -n 1)
          mv "$DEB_FILE" "../../artifacts/dmt-linux-${{ matrix.arch }}-${VERSION}.deb"

      - name: Create GitHub Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          TITLE="Release v$VERSION"

          # Create once, otherwise upload into the existing release. --clobber lets later runners replace same-named assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.deb --clobber
          else
            gh release create "$TAG" artifacts/*.deb --title "$TITLE" --target "$GITHUB_SHA" \
              || gh release upload "$TAG" artifacts/*.deb --clobber
          fi
