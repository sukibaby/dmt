# Provide a trusted build of DMT as efficiently and quickly as possible.
# I'm trying to minimize energy usage / environmental impact, so I'm only building for x86_64 Linux for now.

name: DMT workflow auto-release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build_and_release:
    name: Build & Release!
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Calculate next version
        run: |
          git fetch --force --prune --tags origin
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" "[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n1)
          LATEST_TAG=${LATEST_TAG#v}

          if [ -z "$LATEST_TAG" ]; then
            VERSION=0.1.0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          while git ls-remote --tags --quiet origin "refs/tags/v$VERSION" "refs/tags/$VERSION" | grep -q .; do
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Next version: $VERSION"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libcurl4-openssl-dev gh

      - name: Build x86_64 Linux .deb package
        run: |
          mkdir -p build/x86_64 artifacts
          cd build/x86_64
          cmake -DCMAKE_BUILD_TYPE=Release -DWITH_CPACK=ON -DDMT_VERSION="$VERSION" -DCPACK_PACKAGE_VERSION="$VERSION" -DCMAKE_SYSTEM_PROCESSOR=x86_64 ../..
          cmake --build . --config Release
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="$(dpkg --print-architecture)"
          DEB_FILE=$(ls -1 *.deb | head -n 1)
          mv "$DEB_FILE" "../../artifacts/dmt-linux-x86_64-${VERSION}.deb"

      - name: Create GitHub Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" artifacts/*.deb --title "Release v$VERSION" --target "$GITHUB_SHA"
